<app-portaria-shell>
  <div class="page-header-row">
    <div>
      <h1 class="portaria-section-title">Movimentações</h1>
      <p class="portaria-section-copy">Entrada e saídas do edifício hoje</p>
    </div>
    <div class="page-header-actions">
      <button
        type="button"
        class="portaria-btn portaria-btn--primary"
        (click)="abrirModalEmprestar()"
      >
        <i class="fas fa-plus"></i>
        <span>Registar Entrada</span>
      </button>
    </div>
  </div>

  <!--VISITAS ATIVAS - HISTÓRICO-->
  <div class="tabs">
    <div
      class="tab"
      [class.active]="abaAtiva === componenteAtivo.ATIVAS"
      (click)="selecionarAba(componenteAtivo.ATIVAS)"
    >
      Ativas
    </div>
    <div
      class="tab"
      [class.active]="abaAtiva === componenteAtivo.HISTORICO"
      (click)="selecionarAba(componenteAtivo.HISTORICO)"
    >
      Histórico
    </div>
  </div>

  <ng-container
    *ngIf="abaAtiva === componenteAtivo.ATIVAS; else historicoMovimentacoes"
  >
    <app-visitas-ativas></app-visitas-ativas>
  </ng-container>

  <ng-template #historicoMovimentacoes>
    <app-historico-movimentacoes></app-historico-movimentacoes>
  </ng-template>
</app-portaria-shell>

<ng-container>
  <!-- MODAL REGISTAR VISITA -->
  <app-base-modal
    [modalEstaAberto]="modalIsOpen"
    [titulo]="'Registar Entrada'"
    [subtitulo]="'Insira os dados do visitante'"
    (fechar)="alternarVisibilidadeModal()"
  >
    <form [formGroup]="formularioRegistarVisita" class="portaria-modal__body">
      <div class="form-group">
        <label for="nomeVisitante">
          Nome visitante <span class="required">*</span>
        </label>
        <input
          id="nomeVisitante"
          type="text"
          placeholder=""
          class="search-input"
          formControlName="nomeVisitante"
        />
      </div>

      <div class="form-group">
        <label for="idTipoVisita">
          Tipo de visita <span class="required">*</span>
        </label>
        <select
          id="idTipoVisita"
          formControlName="idTipoVisita"
          class="filter-select"
        >
          <option [ngValue]="null" disabled>Selecione um tipo</option>
          <option *ngFor="let tipo of tipoVisita" [ngValue]="tipo.id">
            {{ tipo.tipo }}
          </option>
        </select>
      </div>

      <!-- ── Destino ── -->
      <div class="form-row">
        <div class="form-group">
          <label for="emprestar-pessoa">Nome funcionário</label>
          <app-funcionario-autocomplete
            #funcionarioAuto
            id="emprestar-pessoa"
            formControlName="idRHFuncionario"
            placeholder="Funcionário responsável..."
          ></app-funcionario-autocomplete>
        </div>
        <div class="form-group">
          <label for="setorFuncionario">Setor do funcionário</label>
          <input
            class="search-input"
            id="setorFuncionario"
            [value]="funcionarioAuto.setorFuncionario"
            type="text"
            formControlName="setorFuncionario"
          />
        </div>
      </div>

      <!-- ── Observação ── -->

      <div class="form-group">
        <label for="observacao">Observação</label>
        <textarea
          class="portaria-modal__textarea"
          id="observacao"
          formControlName="notas"
          placeholder="Notas sobre esta visita (opcional)..."
        ></textarea>
      </div>
    </form>

    <ng-container slot="footer">
      <button
        class="portaria-btn portaria-btn--ghost"
        (click)="alternarVisibilidadeModal()"
      >
        Cancelar
      </button>
      <button
        class="portaria-btn portaria-btn--primary"
        [disabled]="formularioRegistarVisita.invalid"
        (click)="registarFormuluarioVisita()"
      >
        <i class="ft-file-plus"></i>
        {{ botaoEnvio }}
      </button>
    </ng-container>
  </app-base-modal>
</ng-container>

<div class="toast" [class.show]="toastVisivel">
  <i class="ft-check-circle"></i>
  <span>{{ toastMensagem }}</span>
</div>
