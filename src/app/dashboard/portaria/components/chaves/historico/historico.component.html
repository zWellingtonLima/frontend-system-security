<!-- FILTROS -->
<div class="filter-container flex" [formGroup]="filtrosForm">
  <div class="search-wrap flex content-center">
    <i class="fas fa-search"></i>
    <input
      (keyup.enter)="aplicarFiltros()"
      type="text"
      class="search-input"
      formControlName="textoBusca"
      placeholder="Pesquisar por código ou nome de quem levou a chave..."
    />
  </div>
  <label for="data-inicio">Data início: </label>
  <input
    class="filter-select"
    type="date"
    formControlName="dataInicio"
    id="data-inicio"
    (change)="aplicarFiltros()"
  />

  <label for="data-fim">Data fim: </label>
  <input
    class="filter-select"
    type="date"
    formControlName="dataFim"
    id="data-fim"
    (change)="aplicarFiltros()"
  />

  <select
    class="filter-select"
    name="filter-select"
    formControlName="idEdificio"
    (change)="aplicarFiltros()"
  >
    <option value="">Todos os edifícios</option>
    <option *ngFor="let edificio of edificios" [ngValue]="edificio.id">
      {{ edificio.label }}
    </option>
  </select>

  <button
    type="button"
    class="portaria-btn portaria-btn--secondary filter"
    (click)="limparFiltros()"
  >
    <i class="ft-filter"></i>
    Limpar
  </button>
</div>

<app-tabela-filtrada
  [modelo]="modelo"
  [carregando]="carregando$ | async"
  [idDe]="idDaChave"
  textoCarregando="A carregar histórico de empréstimos..."
  mensagemVazia="Nenhum empréstimo encontrado"
>
  <!-- SALA / PISO: o piso é um subtexto por baixo da sala -->
  <ng-template appCelula="sala" let-chave>
    <ng-container *ngIf="chave.sala != null; else semSala">
      Sala {{ chave.sala }}
      <span class="sub-text">{{ chave.pisoLabel }}</span>
    </ng-container>
    <ng-template #semSala><span class="empty-dash">—</span></ng-template>
  </ng-template>

  <app-paginacao rodape [paginador]="paginador"></app-paginacao>
</app-tabela-filtrada>
