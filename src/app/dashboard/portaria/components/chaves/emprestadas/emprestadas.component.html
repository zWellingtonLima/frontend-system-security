<app-tabela-filtrada
  [modelo]="modelo"
  [carregando]="carregando$ | async"
  [idDe]="idDaChave"
  classeTabela="tbl--emprestadas"
  textoCarregando="Carregando chaves..."
  mensagemVazia="Não existem empréstimos no momento."
>
  <!-- SALA / PISO: o piso é um subtexto por baixo da sala -->
  <ng-template appCelula="sala" let-chave>
    <ng-container *ngIf="chave.sala != null; else semSala">
      Sala {{ chave.sala }}
      <span class="sub-text">{{ chave.pisoLabel }}</span>
    </ng-container>
    <ng-template #semSala><span class="empty-dash">—</span></ng-template>
  </ng-template>

  <!-- AÇÕES -->
  <ng-template appCelula="acoes" let-chave>
    <div class="tbl-acoes">
      <!-- Ação primária: corrigir dados ou escolher quem devolve -->
      <button
        class="portaria-btn portaria-btn--secondary"
        type="button"
        title="Atualizar ou devolver"
        [disabled]="salvando$ | async"
        (click)="abrirModalAtualizar(chave)"
      >
        <i class="ft-edit-2"></i>
      </button>
      <!-- Ação secundária: devolve em nome de quem levou -->
      <button
        class="portaria-btn portaria-btn--ghost"
        type="button"
        title="Devolver em nome de {{ chave.nomeFuncionario }}"
        [disabled]="salvando$ | async"
        (click)="devolverRapido(chave)"
      >
        <i class="ft-corner-down-left"></i>
      </button>
    </div>
  </ng-template>
</app-tabela-filtrada>

<!-- =================================================== -->
<!-- MODAL ATUALIZAR / DEVOLVER CHAVE -->
<!-- =================================================== -->
<app-base-modal
  [modalEstaAberto]="atualizarModalIsOpen"
  titulo="Dados do empréstimo"
  subtitulo="Alterar os dados do empréstimo ou registar a devolução da chave"
  (fechar)="fecharModalAtualizar()"
>
  <form
    class="portaria-modal__body"
    [formGroup]="atualizarForm"
    *ngIf="chaveEmEdicao as chave"
  >
    <!-- CONTEXTO (só leitura — não faz parte do formulário) -->
    <div class="chave-info">
      <div class="form-row-port">
        <div class="form-group-port">
          <span class="label">Edifício</span>
          <span class="valor">{{ chave.edificioLabel }}</span>
        </div>
        <div class="form-group-port">
          <span class="label">Código</span>
          <span class="valor">{{ chave.codigo }}</span>
        </div>
      </div>
      <div class="form-row-port">
        <div class="form-group-port">
          <span class="label">Sala / Piso</span>
          <span class="valor" *ngIf="chave.sala != null; else semSalaCtx">
            Sala {{ chave.sala }} · {{ chave.pisoLabel }}
          </span>
          <ng-template #semSalaCtx>
            <span class="valor empty-dash">—</span>
          </ng-template>
        </div>
        <div class="form-group-port">
          <span class="label">Emprestada desde</span>
          <span class="valor" *ngIf="chave.desde; else semDesdeCtx">
            {{ chave.desde | date: "dd/MM/yyyy HH:mm" : "Europe/Lisbon" }}
          </span>
          <ng-template #semDesdeCtx>
            <span class="valor empty-dash">—</span>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- Devolver e corrigir são ações independentes: uma secção de cada vez -->
    <div class="tabs">
      <div
        class="tab"
        *ngFor="let secao of secoes"
        [class.active]="secaoAtiva === secao.value"
        (click)="onSecaoChange(secao.value)"
      >
        {{ secao.label }}
      </div>
    </div>

    <!-- DEVOLUÇÃO — tem botão próprio, não usa o rodapé do modal -->
    <ng-container *ngIf="secaoAtiva === 'DEVOLUCAO'">
      <div class="devolver-block">
        <div class="form-row-port full">
          <div class="form-group-port">
            <label for="atualizar-devolvida-por" class="form-label-port"
              >Quem está a devolver a chave:
            </label>
            <app-funcionario-autocomplete
              id="atualizar-devolvida-por"
              formControlName="idDevolvidaPor"
              placeholder="Quem está a devolver a chave..."
              [temErro]="!!erroDoCampo(atualizarForm, 'idDevolvidaPor')"
            ></app-funcionario-autocomplete>
            <span
              class="form-error"
              *ngIf="erroDoCampo(atualizarForm, 'idDevolvidaPor') as erro"
            >
              {{ erro }}
            </span>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- CORREÇÃO DOS DADOS DO EMPRÉSTIMO — guardada pelo rodapé do modal -->
    <ng-container *ngIf="secaoAtiva === 'EDICAO'">
      <div class="devolver-block">
        <div class="form-row-port primary">
          <div class="form-group-port">
            <label for="atualizar-funcionario" class="form-label-port"
              >Funcionário</label
            >
            <app-funcionario-autocomplete
              id="atualizar-funcionario"
              formControlName="idFuncionarioEmprestimo"
              placeholder="Quem levou a chave..."
              [temErro]="
                !!erroDoCampo(atualizarForm, 'idFuncionarioEmprestimo')
              "
            ></app-funcionario-autocomplete>
            <span
              class="form-error"
              *ngIf="
                erroDoCampo(atualizarForm, 'idFuncionarioEmprestimo') as erro
              "
            >
              {{ erro }}
            </span>
          </div>

          <div class="form-group-port">
            <label for="atualizar-chave" class="form-label-port"
              >Chave selecionada</label
            >
            <!-- Disponíveis + a chave atual, agrupadas por edifício -->
            <ng-container
              *ngIf="opcoesEdicao$ | async as grupos; else aCarregar"
            >
              <select
                id="atualizar-chave"
                class="filter-select"
                formControlName="idChave"
              >
                <optgroup
                  *ngFor="let grupo of grupos"
                  [label]="grupo.edificioLabel"
                >
                  <option
                    *ngFor="let opcao of grupo.chaves"
                    [ngValue]="opcao.id"
                  >
                    {{ opcao.codigo
                    }}<ng-container *ngIf="opcao.sala != null">
                      — Sala {{ opcao.sala }}</ng-container
                    >
                  </option>
                </optgroup>
              </select>
            </ng-container>
            <ng-template #aCarregar>
              <select class="filter-select" disabled>
                <option>A carregar chaves...</option>
              </select>
            </ng-template>
            <span
              class="form-error"
              *ngIf="erroDoCampo(atualizarForm, 'idChave') as erro"
            >
              {{ erro }}
            </span>
          </div>
        </div>
      </div>
    </ng-container>
  </form>

  <ng-container slot="footer" *ngIf="{ salvando: salvando$ | async } as vm">
    <button
      type="button"
      class="portaria-btn portaria-btn--ghost"
      [disabled]="vm.salvando"
      (click)="fecharModalAtualizar()"
    >
      Cancelar
    </button>
    <ng-container *ngIf="secaoAtiva === 'DEVOLUCAO'">
      <button
        type="button"
        class="portaria-btn portaria-btn--primary"
        [disabled]="salvando$ | async"
        (click)="onDevolver()"
      >
        <i class="ft-corner-down-left"></i>
        Devolver
      </button>
    </ng-container>

    <ng-container *ngIf="secaoAtiva === 'EDICAO'">
      <button
        type="button"
        class="portaria-btn portaria-btn--primary"
        [disabled]="vm.salvando"
        (click)="onGuardarAlteracoes()"
      >
        <i class="ft-edit-2"></i>
        Guardar
      </button>
    </ng-container>
  </ng-container>
</app-base-modal>
