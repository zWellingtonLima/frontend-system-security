<app-portaria-shell>
  <div class="page-header-row">
    <div>
      <h1 class="portaria-section-title">Chaves</h1>
      <p class="portaria-section-copy">Gestão e empréstimos de chaves</p>
    </div>

    <div class="page-header-actions">
      <button
        type="button"
        class="portaria-btn portaria-btn--primary ml-auto"
        (click)="abrirModalEmprestar()"
      >
        <i class="fas fa-plus"></i>
        <span>Emprestar Chave</span>
      </button>
    </div>
  </div>

  <!-- Cada tab é uma rota filha -->
  <div class="tabs">
    <a
      class="tab"
      *ngFor="let tab of tabs"
      [routerLink]="[tab.rota]"
      routerLinkActive="active"
    >
      {{ tab.label }}
      <span class="tab-count" *ngIf="tab.rota === 'emprestadas'">
        {{ totalEmprestadas$ | async }}
      </span>
    </a>
  </div>

  <router-outlet></router-outlet>

  <!-- =================================================== -->
  <!-- MODAL EMPRESTAR CHAVE -->
  <!-- =================================================== -->
  <app-base-modal
    [modalEstaAberto]="emprestarModalIsOpen"
    titulo="Emprestar chave"
    subtitulo="Selecione a chave e quem a leva"
    (fechar)="fecharModalEmprestar()"
  >
    <form class="portaria-modal__body" [formGroup]="emprestarForm">
      <p class="form-tipo-title">CHAVES DISPONÍVEIS</p>
      <ng-container
        *ngIf="chavesDisponiveis$ | async as grupos; else aCarregarDisponiveis"
      >
        <div class="form-row-port">
          <div class="form-group-port" *ngFor="let grupo of grupos">
            <label class="form-label-port">{{ grupo.edificioLabel }}</label>
            <select
              class="filter-select"
              [value]="valorSelecionadoEm(grupo)"
              (change)="onEscolherChave($event)"
            >
              <option value="">Escolher chave...</option>
              <option *ngFor="let opcao of grupo.chaves" [value]="opcao.id">
                {{ opcao.codigo
                }}<ng-container *ngIf="opcao.chaveiro != null">
                  — Chaveiro: {{ opcao.chaveiro }}</ng-container
                >
              </option>
            </select>
          </div>
        </div>
      </ng-container>

      <!-- O label vazio para evitar layout shifting -->
      <ng-template #aCarregarDisponiveis>
        <div class="form-row-port">
          <div class="form-group-port">
            <label class="form-label-port">&nbsp;</label>
            <select class="filter-select" disabled>
              <option>A carregar chaves...</option>
            </select>
          </div>
        </div>
      </ng-template>

      <span
        class="form-error"
        *ngIf="erroDoCampo(emprestarForm, 'idChave') as erro"
      >
        {{ erro }}
      </span>

      <div class="form-row-port full">
        <div class="form-group-port">
          <label for="emprestar-pessoa" class="form-label-port"
            >Nome da pessoa</label
          >
          <app-funcionario-autocomplete
            id="emprestar-pessoa"
            formControlName="idFuncionario"
            placeholder="Quem está a levar a chave..."
            [temErro]="!!erroDoCampo(emprestarForm, 'idFuncionario')"
          ></app-funcionario-autocomplete>
          <span
            class="form-error"
            *ngIf="erroDoCampo(emprestarForm, 'idFuncionario') as erro"
          >
            {{ erro }}
          </span>
        </div>
      </div>
    </form>

    <ng-container slot="footer" *ngIf="{ salvando: salvando$ | async } as vm">
      <button
        type="button"
        class="portaria-btn portaria-btn--ghost"
        [disabled]="vm.salvando"
        (click)="fecharModalEmprestar()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="portaria-btn portaria-btn--primary"
        [disabled]="vm.salvando"
        (click)="onEmprestar()"
      >
        <i class="fas fa-key"></i>
        Emprestar
      </button>
    </ng-container>
  </app-base-modal>
</app-portaria-shell>
