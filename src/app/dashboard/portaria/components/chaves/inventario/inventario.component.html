<!-- FILTROS — resolvidos no backend -->
<div class="filter-container flex" [formGroup]="filtrosForm">
  <div class="search-wrap flex content-center">
    <i class="fas fa-search"></i>
    <input
      (keyup.enter)="aplicarFiltros()"
      type="text"
      class="search-input"
      formControlName="textoBusca"
      placeholder="Pesquisar por código da chave..."
    />
  </div>

  <select class="filter-select" name="filter-select" formControlName="idEdificio">
    <option value="">Todos os edifícios</option>
    <option *ngFor="let edificio of edificios" [ngValue]="edificio.id">
      {{ edificio.label }}
    </option>
  </select>

  <select class="filter-select" name="filter-select" formControlName="piso">
    <option value="">Todos os pisos</option>
    <option *ngFor="let piso of pisos" [ngValue]="piso.id">
      {{ piso.label }}
    </option>
  </select>

  <!-- Os filtros só são aplicados aqui: até clicar, o form é só rascunho -->
  <button
    type="button"
    class="portaria-btn portaria-btn--primary"
    [disabled]="carregando$ | async"
    (click)="aplicarFiltros()"
  >
    Procurar
  </button>

  <button
    type="button"
    class="portaria-btn portaria-btn--ghost"
    (click)="limparFiltros()"
  >
    Limpar
  </button>
</div>

<app-tabela-filtrada
  [modelo]="modelo"
  [carregando]="carregando$ | async"
  [idDe]="idDaChave"
  classeTabela="tbl--inventario"
  textoCarregando="Carregando chaves..."
  mensagemVazia="Nenhuma chave encontrada."
>
  <!-- SALA / PISO: o piso é um subtexto por baixo da sala -->
  <ng-template appCelula="sala" let-chave>
    <ng-container *ngIf="chave.sala != null; else semSala">
      Sala {{ chave.sala }}
      <span class="sub-text">{{ chave.pisoLabel }}</span>
    </ng-container>
    <ng-template #semSala><span class="empty-dash">—</span></ng-template>
  </ng-template>

  <!-- ESTADO: badge com ícone e cor -->
  <ng-template appCelula="estado" let-chave>
    <span
      class="badge"
      *ngIf="chave.statusConfig as estado; else semEstado"
      [ngClass]="estado.classe"
    >
      <i [ngClass]="estado.icone"></i>
      {{ estado.label }}
    </span>
    <ng-template #semEstado><span class="empty-dash">—</span></ng-template>
  </ng-template>

  <app-paginacao rodape [paginador]="paginador"></app-paginacao>
</app-tabela-filtrada>
