<ng-container
  *ngIf="
    modelo && {
      colunas: modelo.colunas$ | async,
      linhas: modelo.linhas$ | async,
      temFiltros: modelo.temAtivos$ | async
    } as vm
  "
>
  <div class="tf-tbl-wrap">
    <table
      class="tf-tbl"
      [ngClass]="[classeTabela, modelo.temLarguras ? 'tf-tbl--fixo' : '']"
      [attr.aria-busy]="carregando ? 'true' : null"
    >
      <!-- As larguras vivem aqui e não nos `th`: assim valem para a
           coluna inteira e não dependem de nenhuma linha existir. É o
           que impede as colunas de saltarem quando um filtro esvazia a
           tabela. Sem `largura` declarada os `col` não fazem nada. -->
      <colgroup>
        <col
          *ngFor="let col of vm.colunas; trackBy: trackByChave"
          [style.width]="col.largura || null"
        />
      </colgroup>

      <thead>
        <tr>
          <th
            *ngFor="let col of vm.colunas; trackBy: trackByChave"
            [ngClass]="'col-' + col.chave"
          >
            {{ col.titulo }}
          </th>
        </tr>

        <!-- Só quando alguma coluna declara filtro -->
        <tr appFiltrosColuna *ngIf="modelo.filtravel" [modelo]="modelo"></tr>
      </thead>

      <tbody [class.tf-recarregando]="carregando && vm.linhas?.length > 0">
        <!-- Primeiro carregamento: não há nada no ecrã para manter -->
        <ng-container *ngIf="carregando && !vm.linhas?.length">
          <tr
            class="tf-esqueleto"
            *ngFor="let _ of esqueleto; trackBy: trackByIndice"
          >
            <td
              *ngFor="let col of vm.colunas; trackBy: trackByChave"
              [ngClass]="'col-' + col.chave"
            >
              <span class="tf-esqueleto-barra"></span>
            </td>
          </tr>
        </ng-container>

        <!-- Não há nenhum registro -->
        <tr
          *ngIf="!carregando && !vm.linhas?.length && !vm.temFiltros"
          class="tf-vazio"
        >
          <td [attr.colspan]="vm.colunas?.length">
            <i class="ft-x-circle"></i>
            <p>{{ mensagemVazia }}</p>
          </td>
        </tr>

        <!-- Há dados, mas os filtros não deixaram passar nada -->
        <tr
          *ngIf="!carregando && !vm.linhas?.length && vm.temFiltros"
          class="tf-sem-resultados"
        >
          <td [attr.colspan]="vm.colunas?.length">
            <i class="ft-search"></i>
            <p>Nenhum registo corresponde aos filtros.</p>
            <button type="button" class="tf-btn" (click)="limparFiltros()">
              Limpar
            </button>
          </td>
        </tr>

        <tr *ngFor="let linha of vm.linhas; trackBy: trackByLinha">
          <td
            *ngFor="let col of vm.colunas; trackBy: trackByChave"
            [ngClass]="['col-' + col.chave, col.classe]"
          >
            <!-- A página declarou um ng-template para esta coluna -->
            <ng-container *ngIf="templateDe(col.chave) as celula; else texto">
              <ng-container
                *ngTemplateOutlet="
                  celula;
                  context: { $implicit: linha.item, linha: linha }
                "
              ></ng-container>
            </ng-container>

            <!-- Não declarou: mostra-se o texto que a coluna já calculou -->
            <ng-template #texto>
              <ng-container
                *ngIf="linha.celulas[col.chave] as conteudo; else vazio"
                >{{ conteudo }}</ng-container
              >
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>

<ng-content select="[rodape]"></ng-content>

<!-- Placeholder partilhado por todas as células -->
<ng-template #vazio><span class="tf-dash">—</span></ng-template>
