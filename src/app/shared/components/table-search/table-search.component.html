<th *ngFor="let campo of campos" [ngSwitch]="campo.tipo || 'texto'">
  <ng-container *ngIf="campo.campo">
    <!-- TEXTO -->
    <input
      *ngSwitchCase="'texto'"
      type="text"
      [formControl]="form.controls[campo.campo]"
      [placeholder]="campo.placeholder || campo.label"
      class="filtro-controle"
    />

    <!-- NÚMERO -->
    <input
      *ngSwitchCase="'numero'"
      type="number"
      [formControl]="form.controls[campo.campo]"
      [placeholder]="campo.placeholder || campo.label"
      class="filtro-controle"
    />

    <!-- DATA -->
    <input
      *ngSwitchCase="'data'"
      type="date"
      [formControl]="form.controls[campo.campo]"
      class="filtro-controle"
    />

    <!-- SELECT -->
    <select
      *ngSwitchCase="'select'"
      [formControl]="form.controls[campo.campo]"
      class="filtro-controle"
    >
      <option value="">
        {{ campo.placeholder || campo.label }}
      </option>

      <option *ngFor="let opcao of campo.opcoes" [value]="opcao.valor">
        {{ opcao.label }}
      </option>
    </select>
  </ng-container>
</th>
