<ng-container *ngIf="modelo">
  <th
    *ngFor="let coluna of modelo.colunas$ | async; trackBy: trackByChave"
    [ngClass]="'col-' + coluna.chave"
    [ngSwitch]="coluna.filtro"
    class="filtro-th"
  >
    <input
      *ngSwitchCase="'texto'"
      type="text"
      class="filtro-controlo"
      autocomplete="off"
      [value]="coluna.valor"
      [attr.aria-label]="'Filtrar por ' + coluna.titulo"
      [placeholder]="coluna.titulo"
      (input)="onEscrever(coluna.chave, $event)"
    />

    <select
      *ngSwitchCase="'select'"
      class="filtro-controlo"
      [value]="coluna.valor"
      [attr.aria-label]="'Filtrar por ' + coluna.titulo"
      (change)="onEscolher(coluna.chave, $event)"
    >
      <option value="">Todos</option>
      <option *ngFor="let opcao of coluna.opcoes" [value]="opcao">
        {{ opcao }}
      </option>
    </select>

    <!-- Colunas não filtráveis (ex: ações) ficam com a célula vazia -->
  </th>
</ng-container>
