<div
  class="portaria-modal-overlay"
  *ngIf="modalEstaAberto"
  @overlay
  (mousedown)="aoPremirNoFundo($event)"
  (mouseup)="aoSoltarNoFundo($event)"
  (click)="aoClicarNoFundo()"
>
  <!-- `tabindex="-1"` para o contentor poder receber o foco ao abrir sem
       entrar na cadeia de Tab. É daqui que o ciclo do foco parte. -->
  <div
    #dialogo
    @modal
    (@modal.done)="aoTerminarAbertura()"
    class="portaria-modal"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="titulo"
  >
    <header class="portaria-modal__header">
      <div>
        <h3 class="portaria-modal__title">{{ titulo }}</h3>
        <p *ngIf="subtitulo" class="portaria-modal__subtitle">
          {{ subtitulo }}
        </p>
      </div>
      <button class="portaria-modal__close" (click)="fechar.emit()">
        <i class="ft-x"></i>
      </button>
    </header>

    <div class="portaria-modal__content">
      <ng-content></ng-content>
    </div>

    <footer class="portaria-modal__footer">
      <ng-content select="[slot=footer]"></ng-content>
    </footer>
  </div>
</div>
